name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Fake-but-valid values so the production gates (lib/config/business.ts and
  # lib/config/productionGate.ts) don't block the build check in CI. NONE of
  # these are real business data or real credentials — never put a real secret
  # in this file. See docs/assumptions.md for what's pending.
  NEXT_PUBLIC_SITE_URL: https://ci-build.example.com
  NEXT_PUBLIC_LEGAL_ENTITY_NAME: "Razón social de ejemplo para CI"
  NEXT_PUBLIC_BUSINESS_CANCELLATION_POLICY_TEXT: "Texto de ejemplo para CI."
  ADMIN_EMAIL_ALLOWLIST: ci-admin@example.com
  RATE_LIMIT_HMAC_SECRET: ci-not-a-real-hmac-secret-0123456789abcdef
  SUPABASE_SERVICE_ROLE_KEY: ci-not-a-real-service-role-key
  RESEND_API_KEY: re_ci_not_a_real_key
  RESEND_FROM_EMAIL: turnos-ci@example.com
  OWNER_NOTIFICATION_EMAIL: owner-ci@example.com
  DEPOSIT_TRANSFER_ALIAS: ci.alias.no.real

jobs:
  quality:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    env:
      # The production gate requires an https, non-local Supabase URL; the
      # build never connects to it.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-not-a-real-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Unit tests
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile.json=unit-results.json

      - name: Unit test counts (no skipped tests allowed)
        if: always()
        run: node .github/scripts/test-summary.mjs vitest unit unit-results.json

      - run: pnpm build

      - name: The service role key must never reach the browser bundle
        run: |
          if grep -rIl -e 'ci-not-a-real-service-role-key' -e 'SUPABASE_SERVICE_ROLE_KEY' .next/static; then
            echo "::error::service role key (or its name) found in the client bundle"
            exit 1
          fi
          echo "client bundle is clean"

  db-and-e2e:
    name: Supabase (RLS, RPC, Storage, Edge Function) + Playwright
    runs-on: ubuntu-latest
    env:
      # Points the app (next dev, used by Playwright) at the local Docker
      # stack started below, not at a hosted project. These two keys are the
      # publicly documented demo keys every `supabase start` stack uses
      # (iss: supabase-demo) — they only work against a local instance and are
      # not secrets. The E2E receipt journey needs real ones.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (Postgres + Auth) and apply migrations
        run: supabase start

      - name: Effective grants on enforce_rate_limit (service role only)
        run: |
          DB=supabase_db_good-boy
          docker exec "$DB" psql -U postgres -v ON_ERROR_STOP=1 -c "
            select p.oid::regprocedure as function,
                   has_function_privilege('anon', p.oid, 'execute') as anon,
                   has_function_privilege('authenticated', p.oid, 'execute') as authenticated,
                   has_function_privilege('service_role', p.oid, 'execute') as service_role,
                   p.prosecdef as security_definer,
                   p.proconfig as config
            from pg_proc p
            where p.pronamespace = 'public'::regnamespace
              and p.proname = 'enforce_rate_limit';"
          bad=$(docker exec "$DB" psql -U postgres -At -v ON_ERROR_STOP=1 -c "
            select count(*) from pg_proc p
            where p.pronamespace = 'public'::regnamespace
              and p.proname = 'enforce_rate_limit'
              and (has_function_privilege('anon', p.oid, 'execute')
                or has_function_privilege('authenticated', p.oid, 'execute')
                or not has_function_privilege('service_role', p.oid, 'execute'));")
          if [ "$bad" != "0" ]; then
            echo "::error::enforce_rate_limit must be executable by service_role only"
            exit 1
          fi

      - name: Serve the purge Edge Function (Deno) against the local stack
        run: |
          printf 'PURGE_CRON_SECRET=ci-purge-secret-not-real\n' > supabase/functions/.env
          nohup supabase functions serve --env-file supabase/functions/.env > edge-functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54321/functions/v1/purge-payment-receipts || true)
            if [ "$code" = "405" ]; then echo "edge function is up"; exit 0; fi
            sleep 3
          done
          echo "::error::the purge Edge Function never came up"
          cat edge-functions.log
          exit 1

      - name: Integration tests (RLS, RPC, Storage, purge, emails, Edge Function)
        run: pnpm exec vitest run --config vitest.integration.config.ts --reporter=default --reporter=json --outputFile.json=integration-results.json
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EDGE_FUNCTION_URL: http://127.0.0.1:54321/functions/v1/purge-payment-receipts
          PURGE_CRON_SECRET: ci-purge-secret-not-real

      - name: Integration test counts (no skipped tests allowed)
        if: always()
        run: node .github/scripts/test-summary.mjs vitest integration integration-results.json

      - name: Edge Function log
        if: always()
        run: cat edge-functions.log || true

      - name: Install Playwright browsers
        if: always()
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (smoke + full receipt journey)
        if: always()
        run: pnpm exec playwright test --reporter=github,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json

      - name: E2E counts (no skipped tests allowed)
        if: always()
        run: node .github/scripts/test-summary.mjs playwright e2e e2e-results.json

      - run: supabase stop
        if: always()
