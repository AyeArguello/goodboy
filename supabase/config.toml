project_id = "good-boy"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/admin/auth/reset",
  "http://127.0.0.1:3000/admin/auth/reset",
  "http://localhost:3100/admin/auth/reset",
]
jwt_expiry = 3600
# This is a closed, single-owner admin panel. Users are provisioned explicitly;
# the public application must never create Auth accounts.
enable_signup = false

[auth.email]
enable_confirmations = false

# Same recovery email as production (supabase/templates/recovery.html is the
# local copy of the hosted "Reset password" template): the link opens
# /admin/auth/confirm with a token hash, so it works from any browser. Read the
# message in Inbucket, http://127.0.0.1:54324.
[auth.email.template.recovery]
subject = "Crear contraseña nueva - Good Boy"
content_path = "./supabase/templates/recovery.html"

[inbucket]
enabled = true
port = 54324

# Private bucket for payment receipts (also created by the
# 20261002123846_payment_receipts_flow migration on hosted projects).
# Never public; the server reads/writes it with the service role and the admin
# sees files only through short-lived signed URLs.
[storage.buckets.payment-receipts]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

# Public bucket for the gallery photos (also created by the
# 20261012120000_gallery migration on hosted projects). Anyone can read; only the
# server (service role) writes, after checking the admin session.
[storage.buckets.gallery]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

# Daily purge of expired receipts. Authenticated with PURGE_CRON_SECRET inside
# the function instead of a JWT, because Supabase Cron calls it.
[functions.purge-payment-receipts]
verify_jwt = false
